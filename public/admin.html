<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Stream admin — Open Letter HK</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page admin">
    <header class="masthead">
      <p class="kicker">Admin</p>
      <h1>#openletterhk stream</h1>
      <p class="dateline"><a href="/">← Back to the letter</a></p>
      <nav class="admin-tabs" aria-label="Admin sections">
        <a href="/admin" aria-current="page">Posts</a>
        <a href="/admin/signatures">Signatures</a>
      </nav>
    </header>

    <form id="key-form" class="admin-row">
      <label for="admin-key" class="sr">Admin key</label>
      <input id="admin-key" type="password" autocomplete="current-password" placeholder="Admin key">
      <button type="submit">Unlock</button>
    </form>

    <div id="panel" hidden>
      <p id="admin-status" class="status" role="status" aria-live="polite"></p>
      <p id="feed-status" class="admin-feed"></p>

      <p class="admin-row admin-quick">
        <a href="https://x.com/search?q=%23openletterhk&amp;src=typed_query&amp;f=live" target="_blank" rel="noopener noreferrer">Search #openletterhk on X ↗</a>
        <a href="https://bsky.app/search?q=%23openletterhk" target="_blank" rel="noopener noreferrer">Search on Bluesky ↗</a>
      </p>

      <form id="x-form" class="admin-row">
        <label for="x-url" class="sr">X post link</label>
        <input id="x-url" type="url" placeholder="https://x.com/user/status/1234…" inputmode="url">
        <button type="submit">Add X post</button>
      </form>

      <h2>Posts</h2>
      <p class="admin-legend">Visible posts show on the letter. Filtered posts were dropped automatically; hidden posts were removed by you.</p>
      <ul id="post-list" class="admin-list"></ul>
    </div>
  </main>
  <script src="/admin.js" defer></script>
</body>
</html>

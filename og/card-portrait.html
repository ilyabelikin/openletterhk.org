<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Dancing Script"; font-weight: 400 700; src: url("../public/fonts/dancing-script-latin.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; }
body { background: #fbfaf7; color: #1b1a17; font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; position: relative; overflow: hidden; }
.band { position: absolute; left: 0; right: 0; top: 0; height: 18px; background: #b3261e; }
.wrap { position: absolute; inset: 0; padding: 150px 96px 96px; display: flex; flex-direction: column; }
.kicker { font-size: 30px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #b3261e; }
h1 { margin-top: 34px; font-family: Charter, "Iowan Old Style", Georgia, serif; font-weight: 400; font-size: 118px; line-height: 1.02; letter-spacing: -.02em; }
.quote { margin-top: 84px; padding-left: 34px; border-left: 6px solid #b3261e; font-family: Charter, "Iowan Old Style", Georgia, serif; font-size: 52px; line-height: 1.34; color: #2a2823; }
.foot { margin-top: auto; }
.sig { font-family: "Dancing Script", cursive; font-weight: 500; font-size: 84px; line-height: 1; }
.role { margin-top: 12px; font-size: 28px; color: #55524b; }
.rule { margin: 56px 0 40px; height: 2px; background: #e3e0d8; }
.url { font-size: 48px; font-weight: 600; letter-spacing: -.005em; }
.sub { margin-top: 10px; font-size: 30px; color: #b3261e; font-weight: 600; letter-spacing: .02em; }
.nw { white-space: nowrap; }
</style></head>
<body>
  <div class="band"></div>
  <div class="wrap">
    <div class="kicker">An open letter</div>
    <h1>To Anthropic,<br>from <span class="nw">Hong Kong</span></h1>
    <p class="quote">Safety is important. Equality and inclusion are also important. You have to do both.</p>
    <div class="foot">
      <div class="sig">Ilya Belikin</div>
      <div class="role">Founder of Haah, Inc.</div>
      <div class="rule"></div>
      <div class="url">openletterhk.org</div>
      <div class="sub">Read it &amp; add your signature</div>
    </div>
  </div>
</body></html>

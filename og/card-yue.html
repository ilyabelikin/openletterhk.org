<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Dancing Script"; font-weight: 400 700; src: url("../public/fonts/dancing-script-latin.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; }
body {
  background: #fbfaf7;
  color: #1b1a17;
  font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  position: relative;
  overflow: hidden;
}
.band { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #b3261e; }
.wrap { position: absolute; inset: 0; padding: 64px 80px 56px 96px; display: flex; flex-direction: column; }
.kicker { font-size: 22px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #b3261e; }
h1 { margin-top: 18px; font-family: Charter, "Iowan Old Style", Georgia, serif; font-weight: 400; font-size: 92px; line-height: 1.02; letter-spacing: -.015em; }
.quote { margin-top: 34px; padding-left: 26px; border-left: 4px solid #b3261e; font-family: Charter, "Iowan Old Style", Georgia, serif; font-size: 31px; line-height: 1.38; color: #2a2823; max-width: 900px; }
.foot { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; }
.sig { font-family: "Dancing Script", cursive; font-weight: 500; font-size: 52px; line-height: 1; }
.role { margin-top: 8px; font-size: 19px; color: #55524b; }
.cta { text-align: right; }
.cta .url { font-size: 30px; font-weight: 600; letter-spacing: -.005em; }
.cta .sub { margin-top: 6px; font-size: 19px; color: #b3261e; font-weight: 600; letter-spacing: .02em; }
.kicker { letter-spacing: .3em; }
h1, .quote { font-family: "Songti TC", "Noto Serif TC", Charter, serif; }
h1 { letter-spacing: 0; line-height: 1.15; }
.quote { line-height: 1.6; }
</style></head>
<body>
  <div class="band"></div>
  <div class="wrap">
    <div class="kicker">一封公開信</div>
    <h1>致 Anthropic，<br>來自香港</h1>
    <p class="quote">安全好重要。平等同共融都好重要。你哋兩樣都要做。</p>
    <div class="foot">
      <div>
        <div class="sig">Ilya Belikin</div>
        <div class="role">Haah, Inc. 創辦人</div>
      </div>
      <div class="cta">
        <div class="url">openletterhk.org/yue</div>
        <div class="sub">讀吓，再加上你嘅簽名 →</div>
      </div>
    </div>
  </div>
</body></html>
